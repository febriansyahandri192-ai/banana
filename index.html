    // Safe LocalStorage wrapper prevents data wipe or reset on refresh
    function safeGetItem(key, fallback) {
      try {
        const item = localStorage.getItem(key);
        if (item === null || item === undefined) return fallback;
        const parsed = JSON.parse(item);
        return parsed !== null && parsed !== undefined ? parsed : fallback;
      } catch (e) {
        console.warn(`[SafeStorage] Error reading key "${key}". Fallback restored.`, e);
        return fallback;
      }
    }

    function safeSetItem(key, value) {
      try {
        localStorage.setItem(key, typeof value === 'string' ? value : JSON.stringify(value));
      } catch (e) {
        console.error(`[SafeStorage] Error writing key "${key}".`, e);
      }
    }

    function playAudioFeedback(type = 'success') {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'start') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.12); // E5
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.35);
        } else if (type === 'end') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(659.25, ctx.currentTime); // E5
          osc.frequency.setValueAtTime(523.25, ctx.currentTime + 0.12); // C5
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.35);
        } else if (type === 'error') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.3);
        }
      } catch (e) {
        console.log('Audio feedback prevented', e);
      }
    }

    function saveData() {

      safeSetItem('cba_app_desc', APP_STATE.settings.appDescription);
      safeSetItem('cba_company', APP_STATE.settings.companyName);
      safeSetItem('cba_company_logo', APP_STATE.settings.companyLogo || '');
      
      if (APP_STATE.currentUser) {

    }

    function updateMetaTitle() {

    function applyTheme() {
      if (APP_STATE.theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      safeSetItem('cba_theme', APP_STATE.theme);
    }

    function toggleTheme() {
      APP_STATE.theme = APP_STATE.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
      renderApp();
      showToast(`Mode ${APP_STATE.theme === 'dark' ? 'Gelap' : 'Terang'} diaktifkan`, 'info');
    }

    function toggleAutoToggleScan() {
      APP_STATE.autoToggleScan = !APP_STATE.autoToggleScan;

    function setAccentColor(colorName) {
      APP_STATE.accentColor = colorName;
      saveData();
      renderApp();
      showToast(`Tema warna diubah ke ${colorName}`, 'success');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container') || createToastContainer();
      const toast = document.createElement('div');
      
      const bgColors = {
        success: 'bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900',
        error: 'bg-rose-700 text-white',
        warning: 'bg-amber-600 text-white',
        info: 'bg-slate-700 text-white'
      };

      const icons = {
        success: 'fa-circle-check',
        error: 'fa-triangle-exclamation',
        warning: 'fa-circle-exclamation',
        info: 'fa-circle-info'
      };

      toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl transform transition-all duration-300 translate-y-2 opacity-0 text-sm font-medium ${bgColors[type] || bgColors.info}`;
      toast.innerHTML = `
        <i class="fa-solid ${icons[type] || icons.info} text-base"></i>
        <span>${message}</span>
      `;

      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function createToastContainer() {
      const container = document.createElement('div');
      container.id = 'toast-container';
      container.className = 'fixed bottom-20 md:bottom-6 right-4 left-4 md:left-auto md:w-96 z-50 flex flex-col gap-2 pointer-events-none';
      document.body.appendChild(container);
      return container;
    }

    function formatTime(isoString) {
      if (!isoString) return '-';
      const d = new Date(isoString);
      return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function formatDuration(seconds) {
      if (seconds === null || seconds === undefined || isNaN(seconds)) return '-';
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = Math.floor(seconds % 60);
      const pad = (n) => n.toString().padStart(2, '0');
      if (hrs > 0) return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
      return `${pad(mins)}:${pad(secs)}`;
    }

    function getElapsedTimeInSeconds(startTimeIso) {
      const start = new Date(startTimeIso).getTime();
      const now = new Date().getTime();
      return Math.max(0, Math.floor((now - start) / 1000));
    }

    function startLiveTimers() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        document.querySelectorAll('.live-timer').forEach(el => {
          const startTime = el.getAttribute('data-start');
          if (startTime) el.innerText = formatDuration(getElapsedTimeInSeconds(startTime));
        });
      }, 1000);
    }

        if (identityLabel) identityLabel.innerText = 'Email Admin';

      const input = document.getElementById(inputId);
      const icon = document.getElementById(eyeIconId);
      if (input && icon) {

          input.type = 'text';
          icon.className = 'fa-solid fa-eye-slash text-sm';
        } else {
          input.type = 'password';

    function handleUnifiedLogin(e) {
      e.preventDefault();
      const identity = document.getElementById('login-identity').value.trim();
      const password = document.getElementById('login-password').value.trim();

      if (currentLoginRole === 'admin') {
        const foundAdmin = APP_STATE.admins.find(a => a.email.toLowerCase() === identity.toLowerCase());
        if (foundAdmin) {
          if (foundAdmin.password === password) {
            APP_STATE.currentUser = { ...foundAdmin, roleType: 'admin' };
            APP_STATE.activeTab = 'dashboard';
            saveData();
            showToast(`Selamat datang Admin, ${foundAdmin.name}!`, 'success');
            renderApp();
          } else {
            showToast('Password Admin salah!', 'error');
          }
        } else {
          showToast('Email Admin tidak terdaftar!', 'error');
        }
      } else {
        const foundCrew = APP_STATE.crews.find(c => c.crewId.toLowerCase() === identity.toLowerCase() || c.phone === identity);
        if (foundCrew) {
          const effectivePass = foundCrew.password || foundCrew.crewId;
          if (password === effectivePass) {
            APP_STATE.currentUser = { ...foundCrew, roleType: 'crew' };
            APP_STATE.activeTab = 'crew_dashboard';
            saveData();
            showToast(`Selamat datang Crew, ${foundCrew.name}!`, 'success');
            renderApp();
          } else {
            showToast('Password Crew salah! (Default: ID Crew)', 'error');
          }
        } else {
          showToast('ID Crew / No HP tidak ditemukan!', 'error');
        }
      }
    }

    function handleLogout() {
      if (APP_STATE.scanner) stopScanner();
      APP_STATE.currentUser = null;
      saveData();
      showToast('Anda telah logout.', 'info');
      renderApp();
    }

    function sendRecoveryRequest() {
      const target = document.getElementById('recovery-target').value.trim();
      const modal = document.getElementById('dynamic-modal');
      if (modal) modal.remove();
      if (!target) return;

      const crew = APP_STATE.crews.find(c => c.crewId.toLowerCase() === target.toLowerCase() || c.phone === target);
      if (crew) {
        APP_STATE.requests.unshift({
          id: 'req_' + Date.now(),
          crewId: crew.crewId,
          crewName: crew.name,
          type: 'PASSWORD_RESET',
          description: `Permintaan Reset Password untuk ID ${crew.crewId}`,
          newValue: crew.crewId,
          status: 'PENDING',
          date: new Date().toISOString().split('T')[0]
        });
        saveData();
        showToast('Permintaan reset password telah diajukan ke Admin!', 'success');
      } else {
        showToast('Instruksi pemulihan telah dikirimkan ke kontak terdaftar.', 'info');
      }
    }

    function startCameraScanner() {
      if (APP_STATE.scanner) {
        stopScanner();
        return;
      }
      const html5QrcodeScanner = new Html5Qrcode("reader");
      APP_STATE.scanner = html5QrcodeScanner;
      const btnText = document.getElementById('cam-btn-text');
      if (btnText) btnText.innerText = 'Matikan Kamera';

      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          if (navigator.vibrate) navigator.vibrate(100);
          processScanBarcode(decodedText);
          stopScanner();
        },
        () => {}
      ).catch(() => {
        showToast("Gagal mengakses kamera. Gunakan input ID manual.", "error");
        if (btnText) btnText.innerText = 'Buka Kamera';
        APP_STATE.scanner = null;
      });
    }

    function stopScanner() {
      if (APP_STATE.scanner) {
        APP_STATE.scanner.stop().then(() => {
          APP_STATE.scanner = null;
          const btnText = document.getElementById('cam-btn-text');
          if (btnText) btnText.innerText = 'Buka Kamera';
        }).catch(() => {});
      }
    }

    function processScanBarcode(code) {
      const cleanCode = code.trim();
      const crew = APP_STATE.crews.find(c => c.crewId.toLowerCase() === cleanCode.toLowerCase() || c.id === cleanCode);
      
      if (!crew) {
        playAudioFeedback('error');
        showToast(`Barcode / ID "${cleanCode}" tidak ditemukan.`, 'error');
        return;
      }

      const activeBreak = APP_STATE.breaks.find(b => b.crewId === crew.crewId && b.status === 'ON BREAK');

      if (APP_STATE.autoToggleScan) {
        if (activeBreak) {
          executeEndBreak(activeBreak.id, true);
        } else {
          executeStartBreak(crew.crewId, true);
        }
      } else {
        playAudioFeedback(activeBreak ? 'end' : 'start');
        APP_STATE.activeScanResult = crew;
        showToast(`Crew ${crew.name} terdeteksi!`, 'success');
        renderApp();
      }
    }

    function executeStartBreak(crewId, isAuto = false) {
      const crew = APP_STATE.crews.find(c => c.crewId === crewId);
      if (!crew) return;

      let breakTypeName = 'Meal Break';
      let maxMins = 45;

      const checkedRadio = document.querySelector('input[name="selected_bt"]:checked');
      if (checkedRadio) {
        breakTypeName = checkedRadio.value;
        maxMins = parseInt(checkedRadio.getAttribute('data-max')) || 45;
      } else if (APP_STATE.breakTypes.length > 0) {
        breakTypeName = APP_STATE.breakTypes[0].name;
        maxMins = APP_STATE.breakTypes[0].maxMinutes;
      }

      const newBreak = {
        id: 'brk_' + Date.now(),
        crewId: crew.crewId,
        crewName: crew.name,
        position: crew.position,
        breakType: breakTypeName,
        maxMinutes: maxMins,
        startTime: new Date().toISOString(),
        endTime: null,
        durationSeconds: null,
        startedBy: APP_STATE.currentUser.email || APP_STATE.currentUser.crewId,
        endedBy: null,
        status: 'ON BREAK',
        date: new Date().toISOString().split('T')[0]
      };

      APP_STATE.breaks.unshift(newBreak);
      saveData();

      playAudioFeedback('start');

      APP_STATE.recentScanAlert = {
        type: 'start',
        title: `BREAK DIMULAI: ${crew.name}`,
        subtitle: `Jenis: ${breakTypeName} (${maxMins} Menit)`
      };

      showToast(`Break dimulai untuk ${crew.name} (${breakTypeName})`, 'success');
      APP_STATE.activeScanResult = null;
      renderApp();
    }

    function executeEndBreak(breakId, isAuto = false) {
      const b = APP_STATE.breaks.find(item => item.id === breakId);
      if (!b) return;

      const nowIso = new Date().toISOString();
      const startMs = new Date(b.startTime).getTime();
      const endMs = new Date(nowIso).getTime();
      const durationSec = Math.max(1, Math.floor((endMs - startMs) / 1000));

      b.endTime = nowIso;
      b.durationSeconds = durationSec;
      b.status = 'COMPLETED';
      b.endedBy = APP_STATE.currentUser.email || APP_STATE.currentUser.crewId;

      saveData();

      playAudioFeedback('end');

      APP_STATE.recentScanAlert = {
        type: 'end',
        title: `BREAK SELESAI: ${b.crewName}`,
        subtitle: `Total Durasi: ${formatDuration(durationSec)}`
      };

      showToast(`Break selesai untuk ${b.crewName} (${formatDuration(durationSec)})`, 'success');
      APP_STATE.activeScanResult = null;
      renderApp();
    }

    function exportHistoryExcel() {
      if (!window.XLSX) {
        showToast("Library Excel belum dimuat", "error");
        return;

      const data = APP_STATE.breaks.map((b, index) => ({
        "No": index + 1,
        "Tanggal": b.date,
        "ID Crew": b.crewId,
        "Nama Crew": b.crewName,
        "Posisi": b.position,
        "Jenis Break": b.breakType,
        "Jam Mulai": formatTime(b.startTime),
        "Jam Selesai": formatTime(b.endTime),
        "Durasi": formatDuration(b.durationSeconds),
        "Status": b.status
      }));

      const worksheet = XLSX.utils.json_to_sheet(data);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Riwayat Break");
      XLSX.writeFile(workbook, `Riwayat_Break_Crew_${new Date().toISOString().split('T')[0]}.xlsx`);
      showToast("File Excel berhasil di-download!", "success");
    }

    function approveRequest(reqId) {
      const req = APP_STATE.requests.find(r => r.id === reqId);
      if (!req) return;

      req.status = 'APPROVED';
      const crew = APP_STATE.crews.find(c => c.crewId === req.crewId);

      if (crew) {
        if (req.type === 'PASSWORD_RESET' || req.field === 'password') {
          crew.password = req.newValue || crew.crewId;
        } else if (req.field === 'name') crew.name = req.newValue;
        else if (req.field === 'position') crew.position = req.newValue;
        else if (req.field === 'department') crew.department = req.newValue;
        else if (req.field === 'phone') crew.phone = req.newValue;
      }

      saveData();
      showToast(`Pengajuan ${req.crewName} telah DI-ACC! Data tersimpan permanent.`, 'success');
      renderApp();
    }

    function rejectRequest(reqId) {
      const req = APP_STATE.requests.find(r => r.id === reqId);
      if (!req) return;

      req.status = 'REJECTED';
      saveData();
      showToast(`Pengajuan ${req.crewName} ditolak.`, 'info');
      renderApp();
    }

    function handleAddAdminSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('add-adm-name').value.trim();
      const email = document.getElementById('add-adm-email').value.trim().toLowerCase();
      const role = document.getElementById('add-adm-role').value;
      const phone = document.getElementById('add-adm-phone').value.trim();
      const pass = document.getElementById('add-adm-pass').value.trim();

      if (APP_STATE.admins.some(a => a.email.toLowerCase() === email)) {
        showToast(`Email Admin "${email}" sudah digunakan!`, 'error');
        return;
      }

      const newAdmin = {
        id: 'adm_' + Date.now(),
        name,
        email,
        role,
        phone,
        password: pass,
        createdAt: new Date().toISOString().split('T')[0]
      };

      APP_STATE.admins.push(newAdmin);
      saveData();
      document.getElementById('dynamic-modal').remove();
      showToast(`Admin ${name} berhasil ditambahkan secara manual!`, 'success');
      renderApp();
    }

    function openChangeAdminPasswordModal(adminId) {
      const admin = APP_STATE.admins.find(a => a.id === adminId);
      if (!admin) return;

      const modal = document.createElement('div');
      modal.id = 'dynamic-modal';
      modal.className = 'fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4';
      modal.innerHTML = `

    function handleChangeAdminPasswordSubmit(e, id) {
      e.preventDefault();
      const admin = APP_STATE.admins.find(a => a.id === id);
      const newPass = document.getElementById('new-admin-pass').value.trim();

      if (!admin || !newPass) return;

      admin.password = newPass;
      saveData();
      const modal = document.getElementById('dynamic-modal');
      if (modal) modal.remove();
      showToast(`Password Admin ${admin.name} berhasil diperbarui!`, 'success');
      renderApp();
    }

    function deleteAdmin(id) {
      if (APP_STATE.admins.length <= 1) {
        showToast('Minimal harus ada 1 admin aktif!', 'warning');
        return;
      }
      APP_STATE.admins = APP_STATE.admins.filter(a => a.id !== id);
      saveData();
      showToast('Data Admin dihapus', 'info');
      renderApp();
    }

    function switchTab(tabId) {
      APP_STATE.activeTab = tabId;
      renderApp();

    function renderApp() {
      const app = document.getElementById('app');
      if (!app) return;

      if (!APP_STATE.currentUser) {
        app.innerHTML = renderLoginView();
        return;
      }

      let contentHtml = '';
      const tab = APP_STATE.activeTab;

      if (APP_STATE.currentUser.roleType === 'admin') {
        if (tab === 'dashboard') contentHtml = renderDashboardView();
        else if (tab === 'scan') contentHtml = renderScanView();
        else if (tab === 'active') contentHtml = renderActiveView();
        else if (tab === 'history') contentHtml = renderHistoryView();
        else if (tab === 'crews') contentHtml = renderCrewsView();
        else if (tab === 'approvals') contentHtml = renderApprovalsView();
        else if (tab === 'statuses') contentHtml = renderStatusesView();
        else if (tab === 'breakTypes') contentHtml = renderBreakTypesView();
        else if (tab === 'admins') contentHtml = renderAdminsView();
        else if (tab === 'settings') contentHtml = renderSettingsView();
        else contentHtml = renderDashboardView();
      } else {
        if (tab === 'crew_dashboard') contentHtml = renderCrewDashboardView();
        else if (tab === 'crew_breaks') contentHtml = renderCrewBreaksView();
        else if (tab === 'crew_requests') contentHtml = renderCrewRequestsView();
        else if (tab === 'statuses') contentHtml = renderStatusesView();
        else if (tab === 'crew_profile') contentHtml = renderCrewProfileView();
        else contentHtml = renderCrewDashboardView();
      }

      app.innerHTML = `
        ${renderNavigation()}
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 flex-1 w-full">
          ${contentHtml}
        </main>
      `;

      startLiveTimers();

      if (tab === 'crew_profile' && APP_STATE.currentUser) {
        setTimeout(() => {
          const container = document.getElementById('crew-profile-qrcode');
          if (container) {
            container.innerHTML = '';
            new QRCode(container, {
              text: APP_STATE.currentUser.crewId,
              width: 160,
              height: 160
            });
          }
        }, 50);
      }
    }

    // Inisialisasi awal aplikasi saat loaded
    document.addEventListener('DOMContentLoaded', () => {
      initSeedData();
      renderApp();
    });
  </script>
</body>
</html>
